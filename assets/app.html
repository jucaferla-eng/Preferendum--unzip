const {
  useState,
  useRef,
  useEffect
} = React;

// Opens URLs in the native system browser (Safari/Chrome) instead of
// navigating within the WebView, which would trap the user.
function openExternalLink(url) {
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'openURL', url }));
  } else {
    window.open(url, '_blank', 'noopener,noreferrer');
  }
}

// ── Language bootstrap (module-level so all components can use t()) ──
let __lang = (() => {
  try {
    const s = localStorage.getItem('pref_lang');
    if (s && SUPPORTED_LANGS.includes(s)) return s;
  } catch (e) {}
  const nav = (navigator.language || 'en').toLowerCase().split(/[-_]/)[0];
  return SUPPORTED_LANGS.includes(nav) && nav !== 'en' ? nav : 'en';
})();
function t(key) {
  return TR[key]?.[__lang] ?? TR[key]?.en ?? key;
}
function isRTL() {
  return RTL.includes(__lang);
}
