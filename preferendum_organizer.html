<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Preferendum — Organizer Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0a0d14;--bg2:#111827;--bg3:#1a2332;--blue:#2d6eff;--blue2:#3b7fff;--green:#10b981;--text:#f0f4ff;--muted:rgba(240,244,255,0.68);--border:rgba(255,255,255,0.11);}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
#auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.logo{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:4px;}
.logo span{color:var(--blue);}
.logo-sub{font-size:12px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:36px;}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:400px;}
.auth-tabs{display:flex;gap:8px;margin-bottom:24px;}
.auth-tab{flex:1;padding:10px;background:var(--bg3);border:none;border-radius:8px;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;}
.auth-tab.active{background:var(--blue);color:#fff;font-weight:600;}
.field{margin-bottom:16px;}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.field input,.field select,.field textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;font-family:'Inter',sans-serif;}
.field textarea{min-height:80px;resize:vertical;}
.btn{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;font-family:'Inter',sans-serif;}
.btn:hover{background:var(--blue2);}
.btn-sm{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-outline{background:none;border:1px solid var(--border);color:var(--muted);}
.err{color:#f87171;font-size:13px;margin-top:8px;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-brand{font-family:'Playfair Display',serif;font-size:18px;}
.topbar-brand span{color:var(--blue);}
.logout-btn{font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline;background:none;border:none;}
.content{max-width:640px;margin:0 auto;padding:24px 16px;}
.section-title{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:4px;}
.section-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
.debate-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;}
.debate-title{font-size:16px;font-weight:600;margin-bottom:6px;}
.debate-meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-live{background:rgba(16,185,129,.15);color:#10b981;}
.badge-closed{background:rgba(45,110,255,.15);color:#60a5fa;}
.new-debate-form{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;}
.form-title{font-size:17px;font-weight:600;margin-bottom:20px;}
.options-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.option-row{display:flex;gap:8px;align-items:center;}
.option-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;font-family:'Inter',sans-serif;}
.remove-opt{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;}
.add-opt{background:none;border:1px dashed var(--border);border-radius:8px;color:var(--muted);padding:10px;font-size:13px;cursor:pointer;width:100%;margin-bottom:16px;}
.add-opt:hover{border-color:var(--blue);color:var(--blue);}
.alert{padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:16px;display:none;}
.alert.success{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#10b981;display:block;}
.alert.error{background:rgba(244,63,94,.15);border:1px solid rgba(244,63,94,.3);color:#f87171;display:block;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
#main-app{display:none;}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="logo">prefer<span>endum</span></div>
  <div class="logo-sub">Organizer Panel</div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-reg" onclick="switchTab('register')">Register</button>
    </div>
    <!-- LOGIN -->
    <div id="panel-login">
      <div class="field"><label>Email</label><input type="email" id="l-email" placeholder="you@organization.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="l-pass" placeholder="••••••••"/></div>
      <button class="btn" onclick="doLogin()">Sign In</button>
      <div class="err" id="l-err"></div>
    </div>
    <!-- REGISTER -->
    <div id="panel-reg" style="display:none;">
      <div class="field"><label>Full Name</label><input type="text" id="r-name" placeholder="Your name"/></div>
      <div class="field"><label>Email</label><input type="email" id="r-email" placeholder="you@organization.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="r-pass" placeholder="••••••••"/></div>
      <div class="field"><label>Organization</label><input type="text" id="r-org" placeholder="Municipality, NGO, Company…"/></div>
      <button class="btn" onclick="doRegister()">Create Account</button>
      <div class="err" id="r-err"></div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app">
  <div class="topbar">
    <a href="/" style="text-decoration:none;color:inherit;"><div class="topbar-brand">prefer<span>endum</span></div></a>
    <button class="logout-btn" onclick="doLogout()">Sign out</button>
  </div>
  <div class="content">
    <!-- CREATE NEW -->
    <div class="new-debate-form" id="create-form">
      <div class="form-title">+ New Consultation</div>
      <div class="alert" id="create-alert"></div>
      <div class="field"><label>Title</label><input type="text" id="c-title" placeholder="What should your community decide?"/></div>
      <div class="field"><label>Context / Description</label><textarea id="c-context" placeholder="Provide background information…"></textarea></div>
      <div class="field">
        <label>Options (minimum 2)</label>
        <div class="options-list" id="options-list">
          <div class="option-row"><input type="text" placeholder="Option 1" class="opt-input"/><button class="remove-opt" onclick="removeOpt(this)">×</button></div>
          <div class="option-row"><input type="text" placeholder="Option 2" class="opt-input"/><button class="remove-opt" onclick="removeOpt(this)">×</button></div>
        </div>
        <button class="add-opt" onclick="addOpt()">+ Add option</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="field"><label>Closes At</label><input type="date" id="c-closes"/></div>
        <div class="field"><label>Country</label>
          <select id="c-country">
            <option value="CL">Chile</option>
            <option value="AR">Argentina</option>
            <option value="PE">Peru</option>
            <option value="MX">Mexico</option>
            <option value="CO">Colombia</option>
            <option value="US">United States</option>
            <option value="ES">Spain</option>
            <option value="GLOBAL">Global</option>
          </select>
        </div>
      </div>
      <button class="btn" onclick="createDebate()">Launch Consultation</button>
    </div>

    <!-- MY DEBATES -->
    <div class="section-title">My Consultations</div>
    <div class="section-sub">Consultations you have created</div>
    <div id="debates-list"><div style="color:var(--muted);font-size:14px;">Loading…</div></div>
  </div>
</div>

<script>
const API = 'https://preferendum-unzip.onrender.com';
let token = localStorage.getItem('pref_org_token') || '';
let userName = '';

if (token) showApp();

function switchTab(tab) {
  document.getElementById('panel-login').style.display  = tab === 'login' ? '' : 'none';
  document.getElementById('panel-reg').style.display    = tab === 'register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-reg').classList.toggle('active', tab === 'register');
}

async function doLogin() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  document.getElementById('l-err').textContent = '';
  const r = await fetch(`${API}/organizer/login`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
  const d = await r.json();
  if (!r.ok) { document.getElementById('l-err').textContent = d.detail || 'Login failed'; return; }
  token = d.token;
  userName = d.user?.name || email;
  localStorage.setItem('pref_org_token', token);
  showApp();
}

async function doRegister() {
  const name  = document.getElementById('r-name').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const pass  = document.getElementById('r-pass').value;
  const org   = document.getElementById('r-org').value.trim();
  document.getElementById('r-err').textContent = '';
  const r = await fetch(`${API}/organizer/register`, {method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,email,password:pass,organization:org,country:'CL'})});
  const d = await r.json();
  if (!r.ok) { document.getElementById('r-err').textContent = d.detail || 'Registration failed'; return; }
  token = d.token;
  userName = name;
  localStorage.setItem('pref_org_token', token);
  showApp();
}

function doLogout() {
  token = '';
  localStorage.removeItem('pref_org_token');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none';
}

function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  setDefaultDate();
  loadDebates();
}

function setDefaultDate() {
  const d = new Date();
  d.setMonth(d.getMonth() + 1);
  document.getElementById('c-closes').value = d.toISOString().split('T')[0];
}

function addOpt() {
  const list = document.getElementById('options-list');
  const n = list.children.length + 1;
  const row = document.createElement('div');
  row.className = 'option-row';
  row.innerHTML = `<input type="text" placeholder="Option ${n}" class="opt-input"/><button class="remove-opt" onclick="removeOpt(this)">×</button>`;
  list.appendChild(row);
}

function removeOpt(btn) {
  const list = document.getElementById('options-list');
  if (list.children.length <= 2) return;
  btn.parentElement.remove();
}

function showAlert(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `alert ${type}`;
  el.textContent = msg;
}

async function createDebate() {
  const title   = document.getElementById('c-title').value.trim();
  const context = document.getElementById('c-context').value.trim();
  const closes  = document.getElementById('c-closes').value;
  const country = document.getElementById('c-country').value;
  const options = [...document.querySelectorAll('.opt-input')].map(i => i.value.trim()).filter(Boolean);

  if (!title)          { showAlert('create-alert','error','Title is required'); return; }
  if (options.length < 2) { showAlert('create-alert','error','At least 2 options required'); return; }
  if (!closes)         { showAlert('create-alert','error','Close date is required'); return; }

  const btn = document.querySelector('#create-form .btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creating…';

  const r = await fetch(`${API}/organizers/debates`, {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body: JSON.stringify({
      title, context, options,
      closes_at: closes + 'T23:59:59',
      creator_type: 'organization',
      inst_name: userName,
      scope_country: country,
      verify_days: 7,
    })
  });
  const d = await r.json();
  btn.disabled = false;
  btn.textContent = 'Launch Consultation';

  if (!r.ok) { showAlert('create-alert','error', d.detail || 'Error creating consultation'); return; }
  showAlert('create-alert','success','✓ Consultation created and published!');
  document.getElementById('c-title').value = '';
  document.getElementById('c-context').value = '';
  document.querySelectorAll('.opt-input').forEach((el,i) => { el.value = ''; el.placeholder = `Option ${i+1}`; });
  loadDebates();
}

async function loadDebates() {
  const list = document.getElementById('debates-list');
  list.innerHTML = '<div style="color:var(--muted);font-size:14px;padding:16px 0;">Loading…</div>';
  try {
    const r = await fetch(`${API}/organizers/me/debates`, {headers:{'Authorization':'Bearer '+token}});
    const d = await r.json();
    const debates = d.debates || [];
    if (!debates.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:14px;padding:16px 0;">No consultations yet. Create your first one above.</div>';
      return;
    }
    list.innerHTML = debates.map(db => {
      const isLive = db.status === 'live';
      const opts = db.options || [];
      return `<div class="debate-card">
        <span class="badge ${isLive?'badge-live':'badge-closed'}">${isLive?'● Live':'Closed'}</span>
        <div class="debate-title" style="margin-top:8px;">${db.title}</div>
        ${db.context ? `<div style="font-size:13px;color:var(--muted);margin-top:4px;">${db.context}</div>` : ''}
        <div style="font-size:12px;color:var(--muted);margin-top:8px;">Options: ${opts.join(' · ')}</div>
        <div class="debate-meta">
          <span>⬡ ${db.total_votes||0} votes</span>
          <span>${db.scope_country||'Global'}</span>
          ${db.closes_at ? `<span>Closes ${db.closes_at.split('T')[0]}</span>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = '<div style="color:#f87171;font-size:14px;">Error loading consultations.</div>';
  }
}
</script>
<div style="text-align:center;padding:40px 20px 60px;font-family:'Playfair Display',serif;font-style:italic;font-size:12px;color:rgba(240,244,255,0.2);">En memoria del Socio Fundador José Ignacio Fernández (1989–2024)</div>
</body>
</html>
