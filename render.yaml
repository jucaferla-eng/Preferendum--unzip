services:
  - type: web
    name: preferendum-api
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VOTE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CONTRACT_ADDRESS
        value: ""
      - key: PREFERENDUM_WALLET_KEY
        value: ""
      - key: PREFERENDUM_WALLET_ADDRESS
        value: ""
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: APP_STRIPE_KEY
        sync: false
    healthCheckPath: /
