databases:
  - name: preferendum-db
    databaseName: preferendum
    user: preferendum
    plan: free
    region: oregon

services:
  - type: web
    name: preferendum-unzip
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preferendum-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: VOTE_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        value: ""
      - key: PREFERENDUM_WALLET_KEY
        value: ""
      - key: PREFERENDUM_WALLET_ADDRESS
        value: ""
    healthCheckPath: /
