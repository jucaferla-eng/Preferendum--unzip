services:
  - type: web
    name: preferendum-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        sync: false
      - key: VOTE_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: CONTRACT_ADDRESS
        value: ""
      - key: PREFERENDUM_WALLET_KEY
        value: ""
      - key: PREFERENDUM_WALLET_ADDRESS
        value: ""
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: APP_STRIPE_KEY
        sync: false
    healthCheckPath: /

  - type: cron
    name: preferendum-daily-debates
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import requests, os; url = os.environ.get('BACKEND_URL', 'https://preferendum-unzip-d2zd.onrender.com'); secret = os.environ['ADMIN_SECRET']; r = requests.post(f'{url}/admin/agent/daily-debates/sync?secret={secret}', timeout=300); print(r.json())"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false

  - type: cron
    name: preferendum-income-data
    runtime: python
    # Monthly, 1st of the month — GNI/occupation salary data doesn't move
    # week to week; this matches the "monthly commune update" cadence already
    # documented in targeting_agent.py's own docstrings.
    schedule: "0 6 1 * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import requests, os; url = os.environ.get('BACKEND_URL', 'https://preferendum-unzip-d2zd.onrender.com'); secret = os.environ['ADMIN_SECRET']; r = requests.post(f'{url}/admin/agent/income-data/sync?secret={secret}', timeout=580); print(r.json())"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
