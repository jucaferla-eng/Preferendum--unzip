databases:
  - name: preferendum-db
    databaseName: preferendum
    user: preferendum
    plan: free
    region: oregon

services:
  - type: web
    name: preferendum-unzip
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: preferendum-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: VOTE_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # ── IA y servicios externos ──
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: "us-east-1"
      - key: ADMIN_SECRET
        value: "preferendum-admin-2024"
      # ── Blockchain (pendiente deploy) ──
      - key: CONTRACT_ADDRESS
        value: ""
      - key: PREFERENDUM_WALLET_KEY
        value: ""
      - key: PREFERENDUM_WALLET_ADDRESS
        value: ""
    healthCheckPath: /

  - type: cron
    name: market-data-daily
    runtime: python
    schedule: "0 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: >
      python -c "
      import requests;
      requests.post(
        'https://preferendum-unzip-d2zd.onrender.com/admin/run-market-agent/daily',
        params={'secret': 'preferendum-admin-2024'},
        timeout=600
      )"

  - type: cron
    name: agent-daily-review
    runtime: python
    schedule: "0 9 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: >
      python -c "
      import requests;
      requests.post(
        'https://preferendum-unzip-d2zd.onrender.com/agent/run-task',
        params={'task_name': 'daily_review', 'secret': 'preferendum-admin-2024'},
        timeout=120
      )"
