name: Vote integrity tests

# Runs the automated suite in tests/test_vote_integrity.py against the LIVE
# production server — no mocks, no local server, the real thing — and
# reports PASS or FAIL with no human in the loop, per the founder's
# instruction: "Los test deben correr solos, sin intervención humana, y
# reportar Pass o Fail."
#
# It proves, on every run, with fresh disposable accounts and a fresh
# disposable consultation that it cleans up afterward:
#   1. A user cannot vote twice in the same consultation.
#   2. A physical device (IMEI) cannot be bound to two accounts — the
#      mechanism that makes "one device, one vote" possible.
#   3. A national ID (RUT/DNI) cannot vote twice, even from a different
#      account and a different device.
#   4. Bridge destruction — voter_id is None on the vote row the instant
#      the vote is recorded.
#   5. The verification code is unique per vote, has the right shape
#      (XXXX-XXXX-XXXX), and resolves to the correct option.
#
# Triggers:
#   - After every push to main (i.e. after every deploy, since Render
#     watches main and auto-deploys on push)
#   - On a daily schedule, so a silent regression can't hide over a
#     quiet week
#   - On demand (workflow_dispatch), so anyone with repo access can run
#     it themselves right now and watch it go green or red
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'   # ~06:17 Chile time (UTC-3) — quiet hours, off the demo path
  workflow_dispatch: {}

jobs:
  integrity:
    name: Run vote integrity suite against production
    runs-on: ubuntu-latest
    # Queue runs instead of letting them overlap. Multiple pushes to main
    # in quick succession (e.g. several fixes shipped back-to-back) each
    # trigger their own run AND their own Render redeploy — and a redeploy
    # restarts the live server, resetting any in-flight connections. Two
    # suites hitting the same live server at once (one mid-redeploy) is
    # how a run can fail in ~3 minutes with raw ConnectionResetErrors
    # while its sibling runs pass cleanly in the normal ~20 — a false
    # alarm that looks exactly like a real regression in the failure
    # email. `cancel-in-progress: false` queues the newer run behind the
    # older one rather than canceling either — every push still gets a
    # real, complete, uncontended result; it just may run a bit later.
    concurrency:
      group: integrity-tests
      cancel-in-progress: false
    # Two slow, disclosed dependencies stack here: Render deploys lag
    # ~10-15 min behind the push that triggers them (see the "Wait for
    # this commit" step), and registration is slow because email delivery
    # is a known problem (see CLAUDE.md "EMAIL VERIFICATION FIX" — Resend
    # is pending DNS verification and the Gmail SMTP fallback can hang).
    # Give the whole job real headroom so neither reads as a false "FAIL"
    # on the thing we're actually testing.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Wait for this commit to actually be live (Render deploys lag ~10-15min)
        # A push to main triggers BOTH this workflow and a Render deploy —
        # but Render takes 10-15 minutes to go live, so "just pushed" and
        # "live" are different moments. Running the suite immediately would
        # test the OLD deploy and could report false failures (e.g. brand
        # new endpoints this very commit adds would still 404). /health now
        # reports RENDER_GIT_COMMIT — wait until it matches the commit that
        # triggered this run, so "after each deploy" means what it says.
        # Skips the wait cleanly on manual/scheduled runs (no fixed target SHA).
        if: github.event_name == 'push'
        env:
          BASE_URL: ${{ secrets.PREFERENDUM_BASE_URL || 'https://preferendum-unzip-d2zd.onrender.com' }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for $BASE_URL to report git_commit == $TARGET_SHA ..."
          for i in $(seq 1 60); do
            LIVE_SHA=$(curl -s --max-time 30 "$BASE_URL/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('git_commit',''))" 2>/dev/null || echo "")
            echo "  attempt $i: live=$LIVE_SHA target=$TARGET_SHA"
            if [ -n "$LIVE_SHA" ] && [ "$LIVE_SHA" = "$TARGET_SHA" ]; then
              echo "Deploy is live — proceeding with tests."
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting ~30min for the deploy to go live. Failing loudly rather than testing stale code."
          exit 1

      - name: Run vote integrity suite (live production)
        env:
          # Both vars fall back to the values already baked into the test
          # script (which match the server's current defaults) when no repo
          # secret is configured — so this works out of the box today, and
          # can be overridden later without touching this file if Render's
          # ADMIN_SECRET or URL ever change. (Passing an unset secret as an
          # env var would set it to "" and break the fallback, so we only
          # forward it when it's actually been configured.)
          PREFERENDUM_BASE_URL: ${{ secrets.PREFERENDUM_BASE_URL && secrets.PREFERENDUM_BASE_URL || '' }}
          PREFERENDUM_ADMIN_SECRET: ${{ secrets.PREFERENDUM_ADMIN_SECRET && secrets.PREFERENDUM_ADMIN_SECRET || '' }}
        run: |
          # Strip empty env vars so the script's own defaults apply.
          [ -z "$PREFERENDUM_BASE_URL" ] && unset PREFERENDUM_BASE_URL
          [ -z "$PREFERENDUM_ADMIN_SECRET" ] && unset PREFERENDUM_ADMIN_SECRET

          # Raw job logs require admin rights on this repo to download —
          # which makes failures undiagnosable for anyone without that
          # access (including Claude, working through this autonomously).
          # Writing the FULL pytest output to the job summary instead puts
          # it on a page anyone can read with zero special permissions —
          # "reportar Pass o Fail" should mean a human-readable result is
          # actually reachable, not just a green/red dot.
          set +e
          pytest tests/test_vote_integrity.py -v --tb=long 2>&1 | tee /tmp/pytest_output.txt
          EXIT=${PIPESTATUS[0]}
          set -e

          {
            if [ "$EXIT" -eq 0 ]; then
              echo "## ✅ Vote integrity suite — ALL CHECKS PASSED"
            else
              echo "## ❌ Vote integrity suite — FAILED (exit $EXIT)"
            fi
            echo ""
            echo '```'
            cat /tmp/pytest_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$EXIT"
